<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #0a0a0a;
        color: #e4e4e7;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
      }
      
      .card {
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 0.5rem;
        padding: 3rem;
        text-align: center;
        max-width: 500px;
      }
      
      h1 {
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 1rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      p {
        color: #a1a1aa;
        font-size: 1.1rem;
        margin-bottom: 2rem;
      }
      
      a {
        color: #667eea;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s ease;
      }
      
      a:hover {
        color: #764ba2;
      }
      
      .status {
        margin-top: 2rem;
        padding: 1rem;
        background: #27272a;
        border-radius: 0.25rem;
        font-size: 0.9rem;
      }
      
      .success {
        color: #4ade80;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello World!</h1>
      <p>This is a minimal placeholder demo proving that routing and static assets work correctly.</p>
      <a href="../../">← Back to demos</a>
      
      <div class="status">
        <div class="success">✓ Static routing working</div>
      </div>
    </div>
  </body>
</html>
